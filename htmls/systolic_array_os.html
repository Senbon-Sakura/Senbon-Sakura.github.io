<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>脉动阵列 (上下分行显示版)</title>
    <style>
        :root {
            --cell-size: 45px;
            --gap: 15px;
            --anim-speed: 0.5s;
            --color-pe: #fff;
            --color-pe-active: #fff9c4;
            --color-a: #e3f2fd;
            --color-w: #f3e5f5;
            --color-result: #fff;
            --border-col: #333;
        }

        body {
            font-family: 'Times New Roman', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f6f8;
            padding: 20px;
            margin: 0;
        }

        /* --- 控制面板 --- */
        .controls {
            margin-bottom: 20px;
            background: white;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            gap: 12px;
            align-items: center;
            position: sticky;
            top: 10px;
            z-index: 1000;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background: #1565c0; }
        button.reset { background: #d32f2f; }
        
        .status-display {
            font-weight: bold;
            font-size: 18px;
            min-width: 130px;
            text-align: center;
            font-family: monospace;
        }

        /* --- 主布局：左右结构 --- */
        .main-layout {
            display: flex;
            flex-direction: row;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
            width: 98%;
            max-width: 1600px;
        }

        /* --- 左侧：脉动阵列容器 --- */
        .array-container {
            position: relative;
            width: 800px;
            height: 800px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        /* PE 网格层 */
        .grid-layer {
            display: grid;
            grid-template-columns: repeat(4, var(--cell-size));
            grid-template-rows: repeat(4, var(--cell-size));
            gap: var(--gap);
            position: absolute;
            right: 120px;
            bottom: 120px;
        }

        .pe {
            width: var(--cell-size);
            height: var(--cell-size);
            border: 2px solid var(--border-col);
            border-radius: 50%;
            background: var(--color-pe);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: transform 0.2s, background-color 0.2s;
        }

        .pe.active {
            background-color: var(--color-pe-active);
            border-color: #fbc02d;
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(251, 192, 45, 0.6);
        }

        /* 数据包样式修改：变矮，以便上下堆叠 */
        .packet {
            width: 44px;
            height: 20px; /* 修改：高度减小，原为28px */
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px; /* 修改：字体稍小 */
            font-weight: bold;
            border-radius: 3px;
            border: 1px solid #bbb;
            background: white;
            z-index: 20;
            transition: transform var(--anim-speed) linear;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .packet sub { font-size: 0.7em; vertical-align: sub; }
        .packet.type-a { background: var(--color-a); border-color: #90caf9; color: #0277bd; }
        .packet.type-w { background: var(--color-w); border-color: #ce93d8; color: #7b1fa2; }

        /* --- 右侧：结果矩阵 --- */
        .result-container {
            flex: 1;
            min-width: 400px;
            max-width: 600px;
            height: 600px;    
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .result-container h3 { 
            text-align: center; 
            margin: 0 0 20px 0; 
            color: #444; 
            font-size: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            height: 100%;
        }
        
        @media (min-width: 1400px) {
            .result-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .result-cell {
            background: var(--color-result);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            min-height: 100px; 
            font-size: 12px;
            line-height: 1.8;
            color: #2e7d32;
            text-align: center;
            display: block; 
            overflow: hidden;
        }

        .result-cell sub { font-size: 0.7em; }
        
        .result-cell.updated {
            background-color: #e8f5e9;
            border-color: #66bb6a;
        }
        
        .res-placeholder { color: #ccc; line-height: 100px; }
        
        .axis-label {
            position: absolute;
            font-weight: bold;
            color: #666;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <div class="controls">
        <button onclick="resetSim()" class="reset">↺ 重置 (Reset)</button>
        <button onclick="step(-1)">◀ 上一步</button>
        <button onclick="togglePlay()" id="playBtn">▶ 播放</button>
        <button onclick="step(1)">下一步 ▶</button>
        <div class="status-display" id="stepDisplay">T = 0</div>
    </div>

    <div class="main-layout">
        
        <div class="array-container" id="arrayContainer">
            <div class="axis-label" style="top: 20px; left: 20px;">Input Matrix A (Activations) ➔</div>
            <div class="axis-label" style="top: 20px; right: 20px;">Input Matrix W (Weights) ⤵</div>

            <div class="grid-layer" id="gridLayer"></div>
            <div class="data-layer" id="dataLayer"></div>
        </div>

        <div class="result-container">
            <h3>Result Matrix (Formulas)</h3>
            <div class="result-grid" id="resultGrid"></div>
        </div>
    </div>

<script>
    // --- 配置 ---
    const GRID_SIZE = 4;
    const CELL_SIZE = 45; 
    const GAP = 15;       
    const PACKET_W = 44;
    const PACKET_H = 20; // 修改：高度对应CSS中的新高度
    
    // 布局核心参数
    const CONTAINER_W = 800;
    const CONTAINER_H = 800;
    
    const GRID_REAL_W = GRID_SIZE * CELL_SIZE + (GRID_SIZE - 1) * GAP;
    
    // 阵列网格定位 (右下角)
    const GRID_START_X = CONTAINER_W - 120 - GRID_REAL_W;
    const GRID_START_Y = CONTAINER_H - 120 - GRID_REAL_W;
    
    const STEP_PX = CELL_SIZE + GAP;

    // --- 状态 ---
    let currentStep = 0;
    let isPlaying = false;
    let timer = null;

    function init() {
        createGrid();
        createResultGrid();
        resetSim();
    }

    function createGrid() {
        const grid = document.getElementById('gridLayer');
        grid.innerHTML = '';
        for(let r=0; r<GRID_SIZE; r++) {
            for(let c=0; c<GRID_SIZE; c++) {
                let pe = document.createElement('div');
                pe.className = 'pe';
                pe.id = `pe-${r}-${c}`;
                pe.innerHTML = `<span style="color:#aaa; font-size:10px;">P<sub>${r},${c}</sub></span>`;
                grid.appendChild(pe);
            }
        }
    }

    function createResultGrid() {
        const grid = document.getElementById('resultGrid');
        grid.innerHTML = '';
        for(let r=0; r<GRID_SIZE; r++) {
            for(let c=0; c<GRID_SIZE; c++) {
                let cell = document.createElement('div');
                cell.className = 'result-cell';
                cell.id = `res-${r}-${c}`;
                cell.innerHTML = '<span class="res-placeholder">0</span>';
                grid.appendChild(cell);
            }
        }
    }

    function resetSim() {
        stopPlay();
        currentStep = 0;
        document.querySelectorAll('.result-cell').forEach(c => {
            c.innerHTML = '<span class="res-placeholder">0</span>';
            c.classList.remove('updated');
        });
        document.querySelectorAll('.pe').forEach(p => p.classList.remove('active'));
        updateDisplay();
    }

    function updateDisplay() {
        document.getElementById('stepDisplay').innerText = `T = ${currentStep}`;
        renderPackets();
        calculateState();
    }

    function renderPackets() {
        const layer = document.getElementById('dataLayer');
        layer.innerHTML = '';

        // Matrix A (左->右) - 显示在下方
        for(let r=0; r<GRID_SIZE; r++) {
            for(let k=0; k<GRID_SIZE; k++) {
                let visualCol = currentStep - r - k - 1;
                // 显示更靠左的数据 (-11)
                if (visualCol > -12 && visualCol < GRID_SIZE + 2) {
                    let el = document.createElement('div');
                    el.className = 'packet type-a';
                    el.innerHTML = `A<sub>${r},${k}</sub>`;
                    
                    // 修改位置计算：
                    // 让 A 显示在单元格的下半部分
                    // Y坐标 = 单元格起始Y + 偏移 + (单元格高度的一半左右)
                    let top = GRID_START_Y + r * STEP_PX + (CELL_SIZE / 2) + 1; 
                    let left = GRID_START_X + visualCol * STEP_PX + (CELL_SIZE - PACKET_W)/2;
                    
                    el.style.transform = `translate(${left}px, ${top}px)`;
                    layer.appendChild(el);
                }
            }
        }

        // Matrix W (上->下) - 显示在上方
        for(let c=0; c<GRID_SIZE; c++) {
            for(let k=0; k<GRID_SIZE; k++) {
                let visualRow = currentStep - c - k - 1;
                if (visualRow > -12 && visualRow < GRID_SIZE + 2) {
                    let el = document.createElement('div');
                    el.className = 'packet type-w';
                    el.innerHTML = `W<sub>${k},${c}</sub>`;
                    
                    // 修改位置计算：
                    // 让 W 显示在单元格的上半部分
                    // Y坐标 = 单元格起始Y + 偏移 + (顶部微调)
                    let top = GRID_START_Y + visualRow * STEP_PX + 2; 
                    let left = GRID_START_X + c * STEP_PX + (CELL_SIZE - PACKET_W)/2;

                    el.style.transform = `translate(${left}px, ${top}px)`;
                    layer.appendChild(el);
                }
            }
        }
    }

    function calculateState() {
        if (currentStep === 0) return;

        document.querySelectorAll('.pe').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.result-cell').forEach(c => c.classList.remove('updated'));

        let tempContent = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill().map(()=>[]));
        let activePEs = [];

        for(let t=1; t<=currentStep; t++) {
            for(let r=0; r<GRID_SIZE; r++) {
                for(let c=0; c<GRID_SIZE; c++) {
                    let k = t - 1 - r - c;
                    if (k >= 0 && k < GRID_SIZE) {
                        let term = `A<sub>${r},${k}</sub>·W<sub>${k},${c}</sub>`;
                        tempContent[r][c].push(term);
                        if (t === currentStep) activePEs.push({r, c});
                    }
                }
            }
        }

        for(let r=0; r<GRID_SIZE; r++) {
            for(let c=0; c<GRID_SIZE; c++) {
                let cell = document.getElementById(`res-${r}-${c}`);
                let terms = tempContent[r][c];

                if (terms.length > 0) {
                    let html = "";
                    for(let i=0; i<terms.length; i++) {
                        html += terms[i];
                        if (i < terms.length - 1) {
                            if ((i + 1) % 1 === 0) {
                                html += " + <br>"; 
                            } else {
                                html += " + ";
                            }
                        }
                    }
                    cell.innerHTML = html;
                } else {
                    cell.innerHTML = '<span class="res-placeholder">0</span>';
                }
            }
        }

        activePEs.forEach(pos => {
            document.getElementById(`pe-${pos.r}-${pos.c}`).classList.add('active');
            document.getElementById(`res-${pos.r}-${pos.c}`).classList.add('updated');
        });
    }

    function step(d) {
        let n = currentStep + d;
        if(n < 0) n=0;
        if(n >= 10) stopPlay(); 
        currentStep = n;
        updateDisplay();
    }

    function togglePlay() {
        if(isPlaying) {
            isPlaying = false;
            clearInterval(timer);
            document.getElementById('playBtn').innerText = "▶ 播放";
        } else {
            isPlaying = true;
            document.getElementById('playBtn').innerText = "⏸ 暂停";
            if(currentStep >= 20) currentStep=0;
            timer = setInterval(() => {
                step(1);
                if(currentStep >= 22) togglePlay();
            }, 800);
        }
    }
    
    function stopPlay() {
        isPlaying = false;
        clearInterval(timer);
        document.getElementById('playBtn').innerText = "▶ 播放";
    }

    init();
</script>

</body>
</html>
