<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { margin:0; padding:20px; font-family:'Helvetica Neue',Arial,sans-serif; background:#fff; }
h2 { text-align:center; color:#1a1a2e; margin-bottom:20px; font-size:22px; }
.row { display:flex; gap:20px; justify-content:center; }
.card { flex:1; border-radius:12px; padding:18px; max-width:500px; }
.snoop { background:linear-gradient(135deg,#fff5f5,#ffe0e0); border:2px solid #e74c3c; }
.dir { background:linear-gradient(135deg,#f0f4ff,#dce8ff); border:2px solid #2980b9; }
.card h3 { text-align:center; margin:0 0 12px 0; font-size:17px; }
.card svg { display:block; margin:0 auto; }
.stats { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.stat { flex:1; min-width:90px; padding:8px; border-radius:8px; text-align:center; font-size:12px; }
.stat-bad { background:#fde8e8; color:#c0392b; }
.stat-good { background:#e8f5e9; color:#1b5e20; }
.stat-neutral { background:#fff8e1; color:#e65100; }
</style>
</head>
<body>
<div class="container">
<h2>Cache Coherence Protocol Comparison</h2>
<div class="row">
<div class="card snoop">
<h3>🔔 Snoop-Based Coherence</h3>
<svg viewBox="0 0 440 220" width="440" height="220">
<defs>
<marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e74c3c"/></marker>
</defs>
<line x1="20" y1="60" x2="420" y2="60" stroke="#e74c3c" stroke-width="4" stroke-dasharray="8,4"/>
<text x="220" y="50" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">Shared Bus (Broadcast)</text>
<rect x="60" y="80" width="90" height="40" rx="6" fill="#e74c3c" opacity="0.15" stroke="#e74c3c"/>
<text x="105" y="104" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Core 0</text>
<line x1="105" y1="80" x2="105" y2="65" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr-red)"/>
<rect x="175" y="80" width="90" height="40" rx="6" fill="#e74c3c" opacity="0.15" stroke="#e74c3c"/>
<text x="220" y="104" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Core 1</text>
<line x1="220" y1="80" x2="220" y2="65" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr-red)"/>
<rect x="290" y="80" width="90" height="40" rx="6" fill="#e74c3c" opacity="0.15" stroke="#e74c3c"/>
<text x="335" y="104" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Core N</text>
<line x1="335" y1="80" x2="335" y2="65" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr-red)"/>
<text x="105" y="136" text-anchor="middle" font-size="10" fill="#888">L1$ + L2$</text>
<text x="220" y="136" text-anchor="middle" font-size="10" fill="#888">L1$ + L2$</text>
<text x="335" y="136" text-anchor="middle" font-size="10" fill="#888">L1$ + L2$</text>
<rect x="155" y="155" width="130" height="35" rx="6" fill="#bdc3c7" stroke="#7f8c8d"/>
<text x="220" y="177" text-anchor="middle" font-size="11" fill="#2c3e50" font-weight="bold">DRAM (Memory)</text>
<line x1="220" y1="155" x2="220" y2="65" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="4,3"/>
</svg>
<div class="stats">
<div class="stat stat-bad"><b>Latency</b><br>O(1) bus access</div>
<div class="stat stat-bad"><b>Traffic</b><br>O(N) broadcast</div>
<div class="stat stat-bad"><b>Scalability</b><br>≤ 8-16 cores</div>
<div class="stat stat-good"><b>Storage</b><br>No directory</div>
</div>
</div>
<div class="card dir">
<h3>📖 Directory-Based Coherence</h3>
<svg viewBox="0 0 440 220" width="440" height="220">
<defs>
<marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2980b9"/></marker>
<marker id="arr-grn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#27ae60"/></marker>
</defs>
<rect x="60" y="50" width="320" height="4" rx="2" fill="#2980b9" opacity="0.3"/>
<text x="220" y="44" text-anchor="middle" font-size="11" fill="#2980b9" font-weight="bold">Interconnect (NoC/Mesh)</text>
<rect x="50" y="70" width="80" height="40" rx="6" fill="#2980b9" opacity="0.12" stroke="#2980b9"/>
<text x="90" y="88" text-anchor="middle" font-size="10" fill="#1a5276" font-weight="bold">Core 0</text>
<text x="90" y="102" text-anchor="middle" font-size="9" fill="#888">L1$+L2$</text>
<line x1="90" y1="70" x2="90" y2="54" stroke="#2980b9" stroke-width="1.5"/>
<rect x="180" y="70" width="80" height="40" rx="6" fill="#2980b9" opacity="0.12" stroke="#2980b9"/>
<text x="220" y="88" text-anchor="middle" font-size="10" fill="#1a5276" font-weight="bold">Core 1</text>
<text x="220" y="102" text-anchor="middle" font-size="9" fill="#888">L1$+L2$</text>
<line x1="220" y1="70" x2="220" y2="54" stroke="#2980b9" stroke-width="1.5"/>
<rect x="310" y="70" width="80" height="40" rx="6" fill="#2980b9" opacity="0.12" stroke="#2980b9"/>
<text x="350" y="88" text-anchor="middle" font-size="10" fill="#1a5276" font-weight="bold">Core N</text>
<text x="350" y="102" text-anchor="middle" font-size="9" fill="#888">L1$+L2$</text>
<line x1="350" y1="70" x2="350" y2="54" stroke="#2980b9" stroke-width="1.5"/>
<rect x="140" y="130" width="160" height="48" rx="8" fill="#2980b9" opacity="0.25" stroke="#2980b9" stroke-width="2" stroke-dasharray="6,3"/>
<text x="220" y="150" text-anchor="middle" font-size="11" fill="#1a5276" font-weight="bold">🏠 Directory + LLC Slice</text>
<text x="220" y="168" text-anchor="middle" font-size="9" fill="#555">sharer vector | state | D-bit</text>
<line x1="220" y1="130" x2="220" y2="54" stroke="#2980b9" stroke-width="2" stroke-dasharray="4,3"/>
<rect x="155" y="190" width="130" height="25" rx="6" fill="#bdc3c7" stroke="#7f8c8d"/>
<text x="220" y="207" text-anchor="middle" font-size="10" fill="#2c3e50">DRAM</text>
<line x1="220" y1="190" x2="220" y2="178" stroke="#7f8c8d" stroke-width="1.5"/>
</svg>
<div class="stats">
<div class="stat stat-neutral"><b>Latency</b><br>O(1) indirection</div>
<div class="stat stat-good"><b>Traffic</b><br>O(k) pt-to-pt</div>
<div class="stat stat-good"><b>Scalability</b><br>1000+ cores</div>
<div class="stat stat-bad"><b>Storage</b><br>O(N²) worst-case</div>
</div>
</div>
</div>
</div>
</body>
</html>
